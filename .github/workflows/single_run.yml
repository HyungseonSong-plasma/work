# FileRank: C
name: Single Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      execution:
        description: One registered Python script (pr_merge.py or branch_delete.py)
        required: true
        type: string
      parameters:
        description: Execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

permissions: {}

jobs:
  execute:
    name: ${{ (contains(inputs.execution, 'pr_merge.py') || contains(github.event.comment.body, 'pr_merge.py')) && 'Merge' || 'Delete' }}
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          ((github.event_name == 'workflow_dispatch' && !contains(inputs.execution, ' - ')) ||
           (github.event_name == 'issue_comment' &&
            github.run_attempt == '1' &&
            github.event.issue.pull_request &&
            github.event.comment.user.id == github.event.repository.owner.id &&
            github.event.sender.id == github.event.repository.owner.id &&
            github.event.comment.author_association == 'OWNER' &&
            startsWith(github.event.comment.body, '/execute ') &&
            !contains(github.event.comment.body, ' - '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute one registered Python script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py --single
