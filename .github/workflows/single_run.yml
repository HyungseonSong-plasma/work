# FileRank: C
name: Single Run

on:
  workflow_dispatch:
    inputs:
      execution:
        description: One registered Python script (pr_merge.py or branch_delete.py)
        required: true
        type: string
      parameters:
        description: Execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

      request_id:
        description: Optional trigger comment reference
        required: false
        default: ''
        type: string

run-name: ${{ inputs.execution }} ${{ inputs.request_id }}
permissions: {}

jobs:
  execute:
    name: ${{ contains(inputs.execution, 'pr_merge.py') && 'Merge' || 'Delete' }}
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute one registered Python script
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py --single
