# FileRank: C
name: Execution

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      execution:
        description: Registered scripts in order (e.g. pr_merge.py - branch_delete.py)
        required: true
        type: string
      parameters:
        description: Shared execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

permissions: {}

jobs:
  execute:
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'issue_comment' &&
            github.run_attempt == '1' &&
            github.event.issue.pull_request &&
            github.event.comment.user.id == github.event.repository.owner.id &&
            github.event.sender.id == github.event.repository.owner.id &&
            github.event.comment.author_association == 'OWNER' &&
            startsWith(github.event.comment.body, '/execute '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute registered Python scripts serially
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py
