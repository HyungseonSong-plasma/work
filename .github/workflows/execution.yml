# FileRank: C
name: Execution

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Registered Python script filename (e.g. pr_merge.py)
        required: true
        type: string
      parameters:
        description: Execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

permissions: {}

jobs:
  execute:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute registered Python script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py
