# FileRank: C
name: Delete merged branch

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-merged-branch:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete the unchanged, unused PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: branch_delete.py
          EXECUTION_INPUTS: >-
            ${{ format('{{"pr_number":{0},"expected_head_sha":"{1}"}}',
              github.event.pull_request.number, github.event.pull_request.head.sha) }}
        run: python3 scripts/execute.py
