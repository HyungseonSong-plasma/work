# FileRank: C
name: Trigger

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  route:
    name: Route
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.run_attempt == '1' &&
          github.event.issue.pull_request &&
          github.event.comment.user.id == github.event.repository.owner.id &&
          github.event.sender.id == github.event.repository.owner.id &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/execute ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and dispatch one workflow
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/trigger.py
