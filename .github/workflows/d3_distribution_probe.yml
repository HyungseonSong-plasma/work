# FileRank: C
name: D3 exact-snapshot distribution verification
on:
  push:
    branches: [test/d3-distribution-verification]
    paths: ['.github/workflows/d3_distribution_probe.yml']
permissions: {}
jobs:
  regression:
    if: ${{ github.repository_id == '1473784826' && github.actor_id == '189476866' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3796c9247d872328be1accecfb2a0afc43d21a40
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 090fac0bc51af718c9b85615eee155f2554c0ffe
          path: candidate
          persist-credentials: false
      - name: Verify exact source and Q6 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "3796c9247d872328be1accecfb2a0afc43d21a40"
          test "$(git -C candidate rev-parse HEAD)" = "090fac0bc51af718c9b85615eee155f2554c0ffe"
          for path in app github config work .github/workflows; do
            test "$(git -C baseline rev-parse HEAD:$path)" = "$(git -C candidate rev-parse HEAD:$path)"
          done
          echo "All production source, config and workflow trees unchanged."
          cd candidate
          python -B -m unittest -v tests.verification.test_compare
          python -B tests/verification/compare.py --baseline ../baseline --baseline-sha 3796c9247d872328be1accecfb2a0afc43d21a40 --candidate . --candidate-sha 090fac0bc51af718c9b85615eee155f2554c0ffe
      - name: Build and install wheel and sdist in separate clean environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build==1.3.0
          mkdir "$RUNNER_TEMP/build-wheelhouse"
          python -m pip download --no-deps --only-binary=:all: setuptools==82.0.1 -d "$RUNNER_TEMP/build-wheelhouse"
          export PIP_NO_INDEX=1 PIP_FIND_LINKS="$RUNNER_TEMP/build-wheelhouse"
          python -m pip show build
          cd candidate
          python -B tests/verification/packaging_probe.py
