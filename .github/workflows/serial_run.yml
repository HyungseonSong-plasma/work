# FileRank: C
name: Serial Run

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Ordered scripts (pr_merge.py - branch_delete.py)
        required: true
        type: string
      parameters:
        description: Shared execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

      request_id:
        description: Optional trigger comment reference
        required: false
        default: ''
        type: string

run-name: ${{ inputs.execution }} ${{ inputs.request_id }}
permissions: {}

jobs:
  merge:
    name: Merge
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute first registered script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 -m app execute --serial-stage 1

  delete:
    name: Delete
    needs: merge
    if: ${{ needs.merge.result == 'success' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute second registered script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 -m app execute --serial-stage 2
