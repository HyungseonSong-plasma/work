# FileRank: C
name: Serial Run

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      execution:
        description: Ordered scripts (pr_merge.py - branch_delete.py)
        required: true
        type: string
      parameters:
        description: Shared execution parameters as a JSON object
        required: true
        default: '{}'
        type: string

permissions: {}

jobs:
  merge:
    name: Merge
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          ((github.event_name == 'workflow_dispatch' && contains(inputs.execution, ' - ')) ||
           (github.event_name == 'issue_comment' &&
            github.run_attempt == '1' &&
            github.event.issue.pull_request &&
            github.event.comment.user.id == github.event.repository.owner.id &&
            github.event.sender.id == github.event.repository.owner.id &&
            github.event.comment.author_association == 'OWNER' &&
            startsWith(github.event.comment.body, '/execute ') &&
            contains(github.event.comment.body, ' - '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute first registered script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py --serial-stage 1

  delete:
    name: Delete
    needs: merge
    if: ${{ needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute second registered script
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_INPUTS: ${{ inputs.parameters }}
        run: python3 scripts/execute.py --serial-stage 2
